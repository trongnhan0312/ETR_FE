<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="etrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" /> <!-- Xanh Navy đậm -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Xanh dương sáng -->
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Hình nền bo góc -->
  <rect width="512" height="512" rx="120" fill="url(#etrGradient)" filter="url(#shadow)" />
  
  <!-- Chữ ETR -->
  <text 
    x="256" 
    y="335" 
    font-family="System-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="200" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    letter-spacing="5">
    ETR
  </text>
</svg>
